name: Keep WhatsApp gateway awake

# Mantém o serviço grátis do Render acordado (evita o spin down após 15 min sem tráfego),
# batendo no /health a cada ~10 minutos. Dentro das 750h/mês do plano free.
#
# A URL do gateway pode ser sobrescrita numa "Repository variable" chamada WA_GATEWAY_URL
# (Settings → Secrets and variables → Actions → Variables). Sem ela, usa o valor padrão abaixo.

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 minutos (horário UTC)
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /health (acorda o serviço)
        env:
          URL: ${{ vars.WA_GATEWAY_URL || 'https://wa-gateway-7vcu.onrender.com' }}
        run: |
          set -e
          ping() {
            echo "[$(date -u '+%Y-%m-%d %H:%M:%SZ')] GET $URL/health"
            # --max-time 120 cobre o cold start (~50s) do plano free; 4 tentativas com espera.
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors "$URL/health" || echo "000")
            echo "HTTP $code"
            [ "$code" = "200" ]
          }
          # Dois pings espaçados: se o próximo agendamento atrasar (comum no GitHub), o serviço
          # ainda recebe tráfego no meio da janela e não hiberna.
          ping || echo "primeiro ping falhou (serviço pode estar acordando)"
          sleep 300
          ping
