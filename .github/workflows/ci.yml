name: CI
on:
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Placeholders FALSOS de propósito. O build não lê env (clientes Supabase são
          # criados por request), mas next build inlina NEXT_PUBLIC_*: nunca pôr valor real aqui.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-ci-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
